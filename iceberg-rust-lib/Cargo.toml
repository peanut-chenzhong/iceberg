[package]
name = "iceberg-rust-lib"
version = "0.1.0"
edition = "2021"
description = "A Rust library for reading and writing Iceberg table files using DataFusion"
license = "Apache-2.0"
authors = ["Iceberg Rust Contributors"]

[lib]
name = "iceberg_rust_lib"
path = "src/lib.rs"

[dependencies]
# DataFusion for query execution (includes arrow and parquet)
datafusion = "44"
datafusion-common = "44"
datafusion-expr = "44"
datafusion-physical-expr = "44"

# Use arrow/parquet versions that are compatible with datafusion 44
# Note: datafusion 44 uses arrow 53.x internally
arrow = { version = "53", features = ["prettyprint"] }
arrow-array = "53"
arrow-schema = "53"
arrow-select = "53"
arrow-cast = "53"
parquet = { version = "53", features = ["async", "object_store"] }

# Object store for file system abstraction
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }

# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Roaring bitmap for deletion vectors
roaring = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
bytes = "1"
url = "2"
log = "0.4"
crc32fast = "1"
lz4_flex = "0.11"
uuid = { version = "1", features = ["v4"] }
num_cpus = "1"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false

[features]
default = []
s3 = ["object_store/aws"]
gcs = ["object_store/gcp"]
azure = ["object_store/azure"]
